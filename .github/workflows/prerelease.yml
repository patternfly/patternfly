name: release
on:
  push:
    branches:
      - felt-v1
concurrency:
  group: ${{ github.workflow }}-felt-v1
  cancel-in-progress: false
jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    runs-on: ubuntu-latest
    permissions:
      # Pushes the release commit and tags. This job never receives the OIDC
      # token used for npm trusted publishing.
      contents: write
    outputs:
      prepared: ${{ steps.check-release.outputs.prepared }}
    env:
      SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
      SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN_REDALLEN }} # needs to be an admin token to get around branch protection
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN_REDALLEN }} # needs to be an admin token to get around branch protection
      # Injected by generate-workflows.js
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
      
      - name: Enable Corepack
        shell: bash
        run: corepack enable
      
      - uses: actions/cache@v4
        id: yarn-cache
        name: Load Yarn cache
        with:
          # Cache Yarn and Cypress binaries
          path: |
            ~/.cache/Cypress
            ~/.cache/yarn
            .yarn/cache
          key: ${{ runner.os }}-yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-cache-
      
      - name: Install dependencies
        shell: bash
        run: yarn install --immutable --network-timeout 100000
      - run: yarn lint:sass
        name: Lint SASS
        if: always()
      - run: yarn lint:js
        name: Lint JS
        if: always()
      - run: yarn build-felt
        name: Build Felt
      - uses: actions/cache@v4
        id: docs-cache
        name: Load webpack cache
        with:
          path: '.cache'
          key: ${{ runner.os }}-v4-${{ hashFiles('yarn.lock') }}
      - run: yarn build:docs
        name: Build docs
      - run: node .github/upload-preview.js public
        name: Upload docs
        if: always()
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome
      - run: yarn serve & yarn test
        name: a11y tests
      - run: node .github/upload-preview.js coverage
        name: Upload a11y report
        if: always()
      - run: mkdir ~/.ssh/ && echo -e "Host github.com\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
        name: Avoid Unknown Host for github.com
      - name: Configure release Git identity
        run: |
          git config user.email "patternfly-ci@redhat.com"
          git config user.name "Patternfly CI/CD"
      - name: Verify release tags
        run: |
          echo "Tags merged into HEAD:"
          git tag --merged HEAD | grep felt-v || echo "No felt-v* tags found — this will be the first release"
      - name: Prepare prerelease
        run: npx nx release --preid prerelease --verbose --skip-publish
        env:
          HUSKY: 0
      - name: Check whether a release was prepared
        id: check-release
        run: |
          if git tag --points-at HEAD | grep -q '^felt-v'; then
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            echo "No release commit at HEAD — nothing to publish."
          fi
      - name: Preserve versioned package for publishing
        if: steps.check-release.outputs.prepared == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nx-release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish prerelease to NPM
    needs: prepare
    if: >
      !cancelled() &&
      needs.prepare.outputs.prepared == 'true'
    runs-on: ubuntu-latest
    permissions:
      # This job installs dependencies and runs repository code, so it only
      # receives the npm trusted-publishing OIDC token and read access. It
      # never pushes.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN_REDALLEN }} # needs to be an admin token to get around branch protection
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
      - name: Enable Corepack
        shell: bash
        run: corepack enable
      - name: Download versioned release package
        uses: actions/download-artifact@v4
        with:
          name: nx-release-dist
          path: dist
      - name: Install dependencies
        shell: bash
        run: yarn install --immutable --network-timeout 100000
      - run: npx nx release publish --verbose
        env:
          HUSKY: 0
        name: Publish prerelease to NPM
