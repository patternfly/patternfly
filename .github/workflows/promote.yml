name: promote
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - v6.*
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # This job installs dependencies and runs repository code, so it never
      # receives the OIDC token used for npm trusted publishing.
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          check-latest: true
      - uses: actions/checkout@v4

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Build for promotion
        run: yarn install --immutable && yarn build
      - name: Preserve built package for publishing
        uses: actions/upload-artifact@v4
        with:
          name: promote-dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish stable release to NPM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # This job runs no repository code — it only publishes the prepared
      # artifact using the npm trusted-publishing OIDC token.
      contents: read
      id-token: write
    steps:
      # Node 24.22.1 bundles npm 11.19.1, which supports OIDC trusted
      # publishing (npm >= 11.5.0 required).
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: promote-dist
          path: dist
      - name: Publish to npm
        env:
          HUSKY: 0
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          npm version "$TAG_NAME" --git-tag-version false
          # --ignore-scripts: dist/package.json carries the repo's "prepare":
          # "husky" script, and this job intentionally installs nothing, so the
          # husky binary would not resolve and publish would fail.
          npm publish --ignore-scripts --tag latest
