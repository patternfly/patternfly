name: release
on:
  push:
    tags:
      - felt-v*
jobs:
  build:
    if: "!contains(github.ref_name, 'prerelease')"
    runs-on: ubuntu-latest
    permissions:
      # This job installs dependencies and runs repository code, so it never
      # receives the OIDC token used for npm trusted publishing.
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          check-latest: true
      - name: Enable Corepack
        shell: bash
        run: corepack enable
      - name: Build for promotion
        run: yarn install --immutable --network-timeout 100000 && yarn build
      - name: Preserve built package for publishing
        uses: actions/upload-artifact@v4
        with:
          name: promote-dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish stable release to NPM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # This job runs no repository code — it only publishes the prepared
      # artifact using the npm trusted-publishing OIDC token.
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: promote-dist
          path: dist
      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#felt-v}"
          cd dist
          npm version "$VERSION" --git-tag-version false
          npm publish --tag latest
